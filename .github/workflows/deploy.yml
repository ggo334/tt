name: Build APK (Auto Generate HTML)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build APK
        run: |
          # BUAT FILE HTML LANGSUNG
          cat > index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="id">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>Hallo Dunia</title>
              <style>
                  * { margin: 0; padding: 0; box-sizing: border-box; }
                  body {
                      min-height: 100vh;
                      display: flex;
                      justify-content: center;
                      align-items: center;
                      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                      font-family: Arial, sans-serif;
                  }
                  .container {
                      text-align: center;
                      padding: 3rem 4rem;
                      background: rgba(255,255,255,0.15);
                      backdrop-filter: blur(12px);
                      border-radius: 24px;
                      box-shadow: 0 25px 50px rgba(0,0,0,0.3);
                  }
                  h1 {
                      font-size: 4.5rem;
                      color: #fff;
                      text-shadow: 0 4px 20px rgba(0,0,0,0.3);
                      animation: bounce 2s infinite;
                  }
                  .subtitle {
                      margin-top: 1rem;
                      font-size: 1.2rem;
                      color: rgba(255,255,255,0.8);
                  }
                  @keyframes bounce {
                      0%, 100% { transform: translateY(0); }
                      50% { transform: translateY(-10px); }
                  }
              </style>
          </head>
          <body>
              <div class="container">
                  <h1>🌍 Hallo Dunia!</h1>
                  <p class="subtitle">✦ Selamat datang ✦</p>
              </div>
          </body>
          </html>
          EOF
          
          echo "File index.html berhasil dibuat!"
          cat index.html
          
          # Buat folder web
          mkdir -p web
          cp index.html web/
          
          # Init project
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          
          # Setup Capacitor
          npx cap init HalloDunia com.hallodunia.app --web-dir=web
          npx cap add android
          
          # Sync
          npx cap sync android
          
          # Build
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HalloDunia-App
          path: android/app/build/outputs/apk/debug/app-debug.apk
