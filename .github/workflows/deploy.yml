name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build APK
        run: |
          # Cek apakah index.html ada
          if [ ! -f "index.html" ]; then
            echo "index.html tidak ditemukan, membuat file baru..."
            cat > index.html << 'HTML'
            <!DOCTYPE html>
            <html>
            <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>Hallo Dunia</title>
              <style>
                *{margin:0;padding:0}
                body{display:flex;justify-content:center;align-items:center;min-height:100vh;background:linear-gradient(135deg,#667eea,#764ba2);font-family:sans-serif}
                h1{color:#fff;font-size:4rem;text-shadow:0 4px 20px rgba(0,0,0,0.3)}
              </style>
            </head>
            <body>
              <h1>🌍 Hallo Dunia!</h1>
            </body>
            </html>
            HTML
          fi
          
          # Persiapkan web folder
          mkdir -p web
          cp index.html web/
          
          # Build dengan Capacitor
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init HalloDunia com.hallodunia.app --web-dir=web
          npx cap add android
          npx cap sync android
          
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HalloDunia
          path: android/app/build/outputs/apk/debug/app-debug.apk
